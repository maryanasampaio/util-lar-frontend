<div class="min-h-screen bg-gray-50">
  <!-- Header Laranja -->
  <header class="bg-gradient-to-r from-orange-500 to-orange-400">
    <div class="max-w-7xl mx-auto px-4 py-6">
      <!-- Topo: Logo e Notificações -->
      <div class="flex items-center justify-between mb-6">
        <!-- Logo e Nome -->
        <div class="flex items-center gap-3" (click)="onLogoClick()" (keypress)="onLogoClick()" role="button" tabindex="0">
          <div class="bg-white rounded-xl p-3 shadow-lg cursor-pointer hover:shadow-xl transition-shadow">
            <span class="text-orange-500 font-bold text-2xl">M</span>
          </div>
          <span class="text-white font-semibold text-lg">Móveis</span>
        </div>
        
        <!-- Ícone de Notificação -->
        <button class="relative p-2 text-white hover:bg-white/10 rounded-lg transition-colors">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
          </svg>
          <span *ngIf="isAdmin" class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
        </button>
      </div>
      
      <!-- Título e Subtítulo -->
      <div class="text-white mb-4">
        <h1 class="text-3xl font-bold mb-2">Móveis e Eletrodomésticos</h1>
        <p class="text-white/90 text-sm">Novos e usados de qualidade</p>
      </div>
      
      <!-- Botão Admin (se logado) -->
      <div *ngIf="isAdmin" class="mt-4">
        <button 
          (click)="openCreateModal()"
          class="bg-white text-orange-500 px-6 py-2.5 rounded-lg font-semibold text-sm shadow-md hover:shadow-lg transition-all">
          + Adicionar Produto
        </button>
      </div>
    </div>
  </header>

  <div class="max-w-7xl mx-auto px-4 py-6">
    <!-- Barra de Busca -->
    <div class="mb-6">
      <div class="relative">
        <svg class="absolute left-4 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        <input 
          type="text" 
          [(ngModel)]="searchQuery"
          placeholder="Buscar produtos..."
          aria-label="Buscar produtos"
          class="w-full pl-12 pr-4 py-3 bg-white rounded-lg shadow-sm border border-gray-200 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent">
      </div>
    </div>

    <!-- Filtros em Linha -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
      <!-- Categoria -->
      <div>
        <label for="filter-category" class="block text-sm font-medium text-gray-700 mb-2">Categoria</label>
        <select 
          id="filter-category"
          [(ngModel)]="selectedCategory"
          class="w-full px-4 py-2.5 bg-white rounded-lg shadow-sm border border-gray-200 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent appearance-none cursor-pointer">
          <option *ngFor="let cat of categories" [value]="cat.value">{{ cat.label }}</option>
        </select>
      </div>
      
      <!-- Condição -->
      <div>
        <label for="filter-condition" class="block text-sm font-medium text-gray-700 mb-2">Condição</label>
        <select 
          id="filter-condition"
          [(ngModel)]="selectedCondition"
          class="w-full px-4 py-2.5 bg-white rounded-lg shadow-sm border border-gray-200 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent appearance-none cursor-pointer">
          <option *ngFor="let cond of conditions" [value]="cond.value">{{ cond.label }}</option>
        </select>
      </div>
      
      <!-- Ordenar por -->
      <div>
        <label for="filter-sort" class="block text-sm font-medium text-gray-700 mb-2">Ordenar por</label>
        <select 
          id="filter-sort"
          [(ngModel)]="selectedSort"
          class="w-full px-4 py-2.5 bg-white rounded-lg shadow-sm border border-gray-200 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent appearance-none cursor-pointer">
          <option *ngFor="let sort of sortOptions" [value]="sort.value">{{ sort.label }}</option>
        </select>
      </div>
    </div>

    <!-- Loading -->
    <div *ngIf="isLoading" class="flex justify-center items-center py-20">
      <div class="text-center">
        <div class="animate-spin rounded-full h-16 w-16 border-b-4 border-orange-500 mx-auto mb-4"></div>
        <p class="text-gray-600 text-lg">Carregando produtos...</p>
      </div>
    </div>

    <!-- Erro -->
    <div *ngIf="errorMessage && !isLoading" 
      class="bg-red-50 border-l-4 border-red-500 text-red-800 px-6 py-4 rounded-lg mb-6">
      <p class="font-bold">❌ {{ errorMessage }}</p>
    </div>

    <!-- Lista Vazia -->
    <div *ngIf="!isLoading && !errorMessage && filteredProducts.length === 0" 
      class="bg-white rounded-xl p-16 text-center shadow-sm">
      <svg class="w-24 h-24 mx-auto mb-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/>
      </svg>
      <p class="text-gray-500 text-xl font-semibold mb-2">Nenhum produto encontrado</p>
      <p class="text-gray-400">Tente ajustar os filtros ou a busca</p>
    </div>

    <!-- Grid de Produtos -->
    <div *ngIf="!isLoading && filteredProducts.length > 0" 
      class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      
      <article 
        *ngFor="let produto of filteredProducts; trackBy: trackByProductId" 
        (click)="verDetalhes(produto.id)"
        (keypress)="verDetalhes(produto.id)"
        role="button"
        tabindex="0"
        class="bg-white rounded-xl shadow-sm hover:shadow-lg transition-all duration-300 overflow-hidden cursor-pointer group">
        
        <!-- Imagem -->
        <div class="aspect-square bg-gray-100 relative overflow-hidden">
          <!-- Badge Vendido -->
          <div *ngIf="produto.disponivel === 0" 
            class="absolute inset-0 bg-black/60 z-20 flex items-center justify-center">
            <span class="bg-gray-700 text-white px-6 py-3 rounded-lg text-xl font-bold shadow-xl">
              ✓ VENDIDO
            </span>
          </div>
          
          <img 
            *ngIf="produto.images && produto.images.length > 0" 
            [src]="produto.images[0]" 
            [alt]="produto.name"
            class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
          
          <div *ngIf="!produto.images || produto.images.length === 0" 
            class="w-full h-full flex items-center justify-center">
            <svg class="h-24 w-24 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
            </svg>
          </div>
        </div>
        
        <!-- Conteúdo -->
        <div class="p-4">
          <!-- Nome do Produto -->
          <h3 class="text-gray-900 font-semibold text-base mb-2 line-clamp-2 group-hover:text-orange-500 transition-colors">
            {{ produto.name | capitalize }}
          </h3>
          
          <!-- Avaliação (Estrelas) -->
          <div class="flex items-center gap-2 mb-3">
            <!-- 5 Estrelas -->
            <div class="flex text-orange-400">
              <svg *ngFor="let star of [1,2,3,4,5]" class="w-4 h-4 fill-current" viewBox="0 0 20 20">
                <path d="M10 15l-5.878 3.09 1.123-6.545L.489 6.91l6.572-.955L10 0l2.939 5.955 6.572.955-4.756 4.635 1.123 6.545z"/>
              </svg>
            </div>
            <span class="text-gray-600 text-sm">({{ getProductReviewCount(produto.id) }})</span>
          </div>
          
          <!-- Preço -->
          <div class="text-2xl font-bold text-gray-900 mb-3">
            R$ {{ formatarPreco(produto.price) }}
          </div>
          
          <!-- Botões Admin -->
          <div *ngIf="isAdmin" class="grid grid-cols-3 gap-2 pt-3 border-t border-gray-100" (click)="$event.stopPropagation()" (keypress)="$event.stopPropagation()">
            <button 
              (click)="openEditModal(produto)"
              class="bg-blue-50 hover:bg-blue-100 text-blue-600 py-2 rounded-lg text-sm font-medium transition-colors"
              title="Editar">
              ✏️
            </button>
            
            <button 
              *ngIf="produto.disponivel === 1"
              (click)="marcarComoVendido(produto.id, $event)"
              class="bg-green-50 hover:bg-green-100 text-green-600 py-2 rounded-lg text-sm font-medium transition-colors"
              title="Vender">
              ✓
            </button>
            
            <button 
              *ngIf="produto.disponivel === 0"
              (click)="reativarProduto(produto.id, $event)"
              class="bg-amber-50 hover:bg-amber-100 text-amber-600 py-2 rounded-lg text-sm font-medium transition-colors"
              title="Reativar">
              ↻
            </button>
            
            <button 
              (click)="removerProduto(produto.id, $event)"
              class="bg-red-50 hover:bg-red-100 text-red-600 py-2 rounded-lg text-sm font-medium transition-colors"
              title="Deletar">
              🗑️
            </button>
          </div>
        </div>
      </article>
    </div>
  </div>
</div>

<!-- Modais -->
<app-product-form-modal
  [isOpen]="showCreateModal"
  (closeModal)="closeCreateModal()"
  (submitForm)="onCreateProduct($event)">
</app-product-form-modal>

<app-product-form-modal
  [isOpen]="showEditModal"
  [product]="selectedProduct"
  (closeModal)="closeEditModal()"
  (submitForm)="onUpdateProduct($event)">
</app-product-form-modal>

<!-- Modal de Login Admin -->
<app-admin-login-modal
  *ngIf="showAdminLoginModal"
  (closeModal)="closeAdminLoginModal()"
  (adminAuthenticated)="onAdminAuthenticated($event)">
</app-admin-login-modal>

<!-- Modal de Boas-vindas -->
<app-welcome-modal
  *ngIf="showWelcomeModal"
  (closeModal)="closeWelcomeModal()">
</app-welcome-modal>
