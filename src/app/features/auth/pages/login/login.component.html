<div class="w-full max-w-md mx-auto animate-fade-up">
  <!-- Logo mobile -->
  <div class="flex justify-center mb-8 lg:hidden">
    <div class="rounded-2xl p-4 shadow-lg shadow-brand-500/30 bg-gradient-to-br from-brand-700 to-brand-500">
      <img src="logo-branca.png" alt="Util Lar" class="w-14 h-14 object-contain">
    </div>
  </div>

  <div class="card p-6 sm:p-8">
    <!-- Heading -->
    <div class="mb-7">
      <h2 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-ink mb-1.5">Bem-vindo de volta</h2>
      <p class="text-sm text-muted">Faça login para acessar o painel da Util Lar</p>
    </div>

    @if (errorMessage) {
      <div class="mb-5 p-3.5 rounded-xl flex items-center gap-3 text-sm bg-danger-50 border border-danger-200 text-danger-600 animate-fade-in">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <span class="font-medium">{{ errorMessage }}</span>
      </div>
    }

    <form (ngSubmit)="onSubmit()" onsubmit="return false;" class="space-y-5">
      <!-- Usuário -->
      <div>
        <label for="username" class="block text-sm font-semibold text-ink mb-2">Usuário</label>
        <div class="relative">
          <svg class="absolute left-3.5 top-1/2 -translate-y-1/2 w-5 h-5 text-subtle pointer-events-none" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
          </svg>
          <input
            type="text"
            id="username"
            [(ngModel)]="username"
            name="username"
            [disabled]="isLoading"
            autocomplete="username"
            class="input pl-11 pr-4 py-3"
            placeholder="Digite seu usuário"
          />
        </div>
      </div>

      <!-- Senha -->
      <div>
        <label for="password" class="block text-sm font-semibold text-ink mb-2">Senha</label>
        <div class="relative">
          <svg class="absolute left-3.5 top-1/2 -translate-y-1/2 w-5 h-5 text-subtle pointer-events-none" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
          </svg>
          <input
            type="password"
            id="password"
            [(ngModel)]="password"
            name="password"
            [disabled]="isLoading"
            autocomplete="current-password"
            class="input pl-11 pr-4 py-3"
            placeholder="••••••••"
          />
        </div>
      </div>

      <!-- Botão -->
      <button type="submit" [disabled]="isLoading" class="btn-primary w-full py-3 text-sm mt-2">
        @if (isLoading) {
          <span class="animate-spin rounded-full h-4 w-4 border-2 border-white/40 border-t-white"></span>
          Entrando...
        } @else {
          Entrar
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
        }
      </button>
    </form>
  </div>

  <!-- Rodapé -->
  <p class="text-center mt-6 text-xs text-subtle">
    Util Lar &copy; {{ currentYear }} — Todos os direitos reservados
  </p>
</div>
