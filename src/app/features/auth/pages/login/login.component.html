<div class="w-full max-w-md bg-white rounded-lg shadow-md p-6 sm:p-8 mx-4" style="border: 1px solid #D7DDE3;">
  <div class="flex justify-center mb-4">
    <img src="logo-utilar.png" alt="Util Lar" class="w-16 h-16 object-contain">
  </div>
  <h2 class="text-2xl font-bold text-center mb-6" style="color: #23292A;">Login</h2>

  @if (errorMessage) {
    <div class="mb-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded-md">
      {{ errorMessage }}
    </div>
  }

  <form (ngSubmit)="onSubmit()" onsubmit="return false;" class="space-y-4">
    <div>
      <label for="username" class="block text-sm font-medium mb-1" style="color: #23292A;">
        Usuário
      </label>
      <input
        type="text"
        id="username"
        [(ngModel)]="username"
        name="username"
        [disabled]="isLoading"
        class="w-full px-3 py-2 rounded-md focus:outline-none focus:ring-2 disabled:bg-gray-100" style="border: 1px solid #D7DDE3; background-color: #EDF1F4;"
        placeholder="Usuário"
      />
    </div>

    <div>
      <label for="password" class="block text-sm font-medium mb-1" style="color: #23292A;">
        Senha
      </label>
      <input
        type="password"
        id="password"
        [(ngModel)]="password"
        name="password"
        [disabled]="isLoading"
        class="w-full px-3 py-2 rounded-md focus:outline-none focus:ring-2 disabled:bg-gray-100" style="border: 1px solid #D7DDE3; background-color: #EDF1F4;"
        placeholder="••••••••"
      />
    </div>
    <button
      type="submit"
      [disabled]="isLoading"
      class="w-full text-white py-2 px-4 rounded-md focus:outline-none focus:ring-2 focus:ring-offset-2 transition-colors disabled:opacity-50 disabled:cursor-not-allowed" style="background-color: #7588A8;"
    >
      @if (isLoading) {
        <span>Entrando...</span>
      } @else {
        <span>Entrar</span>
      }
    </button>
  </form>
</div>
